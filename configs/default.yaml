testname: VioLM MUSHRA Test Demo
testId: default_example
bufferSize: 2048
stopOnErrors: true
showButtonPreviousPage: true
# Empty = no server upload (required on GitHub Pages; PHP is not available). Use google-forms-submit.js for Google Forms.
remoteService: ""


pages:
    - type: generic
      id: first_page
      name: Welcome
      content: Welcome to VioLM MUSHRA!
    - type: mushra
      id: trial1
      name: MUSHRA
      content: This training shows how to use the interface; follow the underlined cues.<br/>The main trials ask for ratings of audio quality, musical realism, and playing technique; here you practice on simplified conditions.<br/>As in standard MUSHRA, use one overall Basic Audio Quality judgment per item against the reference.
      showWaveform: true
      enableLooping: true
      reference: configs/resources/audio/mono_ref.wav
      createAnchor35: true
      createAnchor70: false
      stimuli:
          C1: configs/resources/audio/mono_c1.wav
          C2: configs/resources/audio/mono_c2.wav
          C3: configs/resources/audio/mono_c3.wav
          C4: configs/resources/audio/mono_c3.wav
    - type: mushra
      id: trial_001
      name: MUSHRA - trial_001
      content: Rate each excerpt on audio quality, resemblance to a live violin performance, and naturalness of playing technique.<br/><br/>Adjust every condition slider at least once before continuing.
      showWaveform: true
      enableLooping: true
      reference: configs/resources/audio/violin-valle-processed/trial_001/reference.mp3
      createAnchor35: false
      createAnchor70: false
      stimuli:
          anchor: configs/resources/audio/violin-valle-processed/trial_001/anchor.mp3
          arti: configs/resources/audio/violin-valle-processed/trial_001/arti.mp3
          arti-sft: configs/resources/audio/violin-valle-processed/trial_001/arti-sft.mp3
          midi_player: configs/resources/audio/violin-valle-processed/trial_001/midi_player.mp3
          no-arti: configs/resources/audio/violin-valle-processed/trial_001/no-arti.mp3
          no-arti-sft: configs/resources/audio/violin-valle-processed/trial_001/no-arti-sft.mp3
          violindiff: configs/resources/audio/violin-valle-processed/trial_001/violindiff.mp3

